name: New event
description: Add, change or cancel an event on the proto.college schedule
title: "[Event]: "
labels: ["event"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this form adds the event to **Upcoming Events** on [proto.college](https://proto.college) within a few minutes.

        - **To change or cancel an event**, submit the form again with the **same title and date**. It replaces the earlier entry.
        - You can also skip this form and add a markdown file to `src/events/` directly, copying `src/events/_template.md`.
        - Only submissions from repository maintainers are published.
  - type: dropdown
    id: type
    attributes:
      label: Event type
      options:
        - Reading group
        - Working group
        - Workshop
        - Session
        - Other
      default: 0
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: RG Biweekly
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-10-07"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Start time (Copenhagen time)
      description: "24-hour clock, Copenhagen/Berlin local time."
      placeholder: "16:00"
    validations:
      required: true
  - type: input
    id: duration
    attributes:
      label: Duration (minutes)
      placeholder: "90"
  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: Algorithms & Distributed Networks
  - type: textarea
    id: readings
    attributes:
      label: Readings
      description: One per line.
      placeholder: |
        Brekke et al. (2021) 'The Dissensus Protocol'
        Galloway (2006) 'Protocol'
  - type: input
    id: link
    attributes:
      label: Join link
      description: Meeting or registration link shown on the website. Must start with https://
      placeholder: https://meet.jit.si/protocollege-reading-group
  - type: input
    id: access
    attributes:
      label: Passcode
      description: Optional meeting passcode.
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Confirmed
        - To be confirmed
        - Cancelled
      default: 0
    validations:
      required: true
